<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xidle UI mockup</title>
<!-- Static mockup for docs/ui/research.md. Not part of the game build.
     Open through the dev server: http://localhost:5173/docs/ui/mockup.html
     Query: ?lang=vi, ?view=adventure|maps|mapinfo|boss|recruit|team|desktop -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tiny5&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #11131d; --bg-2: #171a28; --panel: #1d2133; --panel-2: #262b42; --line: #3a4163;
  --text: #eef0f7; --muted: #9aa3c0; --dim: #5d6585;
  --accent: #e2453c; --accent-dark: #9e2a24; --gold: #f4c245; --hp: #4cc46a; --hp-low: #e8a33a; --hp-crit: #e2453c;
  --metal: #aab4c3; --wood: #4caf50; --water: #3d8bf2; --fire: #ef5a3c; --earth: #c08a3e; --light: #f2d45c; --dark: #8a5cd6;
  --pixel: "Tiny5", ui-monospace, monospace;
  --body: system-ui, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: #0b0c13; color: var(--text); font: 14px/1.4 var(--body); }
.gallery { display: flex; flex-wrap: wrap; gap: 24px; padding: 24px; align-items: flex-start; }
.gallery > figure { margin: 0; }
.gallery figcaption { font: 16px var(--pixel); color: var(--muted); margin-bottom: 8px; }
.phone { width: 400px; height: 820px; background: var(--bg); position: relative; overflow: hidden; border: 1px solid #000; display: flex; flex-direction: column; }
.single .gallery { padding: 0; gap: 0; }
.single .gallery figcaption { display: none; }
.single .phone { width: 100vw; height: 100vh; border: 0; }
.single .desk { width: 100vw; height: 100vh; border: 0; }
.single figure { display: none; }
.single figure.on { display: block; }

/* ---------- shared pieces ---------- */
.px { font-family: var(--pixel); letter-spacing: .5px; }
.topbar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--bg-2); border-bottom: 2px solid #000; }
.topbar .logo { font: 22px var(--pixel); color: var(--accent); margin-right: auto; text-shadow: 2px 2px 0 #000; }
.res { display: flex; align-items: center; gap: 4px; background: var(--panel); border: 2px solid #000; padding: 2px 8px; font: 15px var(--pixel); }
.res i { width: 10px; height: 10px; display: inline-block; border: 1px solid #000; }
.res .gold { background: var(--gold); border-radius: 50%; }
.res .food { background: #e9875a; border-radius: 3px; }
.iconbtn { width: 34px; height: 34px; display: grid; place-items: center; background: var(--panel); border: 2px solid #000; color: var(--text); font: 14px var(--pixel); }
.ticker { font-size: 12px; color: var(--muted); padding: 6px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ticker b { color: var(--gold); font-weight: 600; }
.scroll { flex: 1; overflow: auto; padding: 10px 12px 12px; }
.card { background: var(--panel); border: 2px solid #000; box-shadow: inset 0 0 0 1px var(--line); border-radius: 6px; padding: 10px; }
.card + .card { margin-top: 10px; }
.h { font: 15px var(--pixel); color: var(--text); display: flex; align-items: center; gap: 6px; margin: 0 0 8px; }
.h .right { margin-left: auto; color: var(--gold); }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.el { display: inline-block; font: 11px var(--pixel); padding: 1px 6px; border: 1px solid #000; border-radius: 3px; color: #111; vertical-align: middle; }
.el.metal { background: var(--metal); } .el.wood { background: var(--wood); } .el.water { background: var(--water); color: #fff; }
.el.fire { background: var(--fire); color: #fff; } .el.earth { background: var(--earth); } .el.dark { background: var(--dark); color: #fff; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 16px; font: 16px var(--pixel); color: #fff; background: var(--accent); border: 2px solid #000; box-shadow: inset 0 -4px 0 var(--accent-dark); border-radius: 4px; }
.btn.ghost { background: var(--panel-2); box-shadow: inset 0 -4px 0 #151827; }
.btn.gold { background: var(--gold); color: #1a1300; box-shadow: inset 0 -4px 0 #a37a12; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .45; }
.bar { height: 6px; background: #0a0b12; border: 1px solid #000; border-radius: 2px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--hp); }
.bar.low > span { background: var(--hp-low); } .bar.crit > span { background: var(--hp-crit); }
.bar.prog > span { background: var(--gold); }
.row { display: flex; align-items: center; gap: 8px; }
.grow { flex: 1; min-width: 0; }
.pill { font: 12px var(--pixel); padding: 2px 8px; border: 2px solid #000; background: var(--panel-2); border-radius: 999px; }
.pill.on { background: var(--accent); }
.toggle { width: 38px; height: 22px; background: var(--hp); border: 2px solid #000; border-radius: 999px; position: relative; }
.toggle::after { content: ""; position: absolute; right: 2px; top: 2px; width: 14px; height: 14px; background: #fff; border-radius: 50%; }

/* sprites: atlas crops scaled with nearest-neighbour */
.spr { display: inline-block; position: relative; vertical-align: bottom; }
.spr > span { position: absolute; left: 0; bottom: 0; background-repeat: no-repeat; image-rendering: pixelated; transform-origin: 0 100%; }
.portrait { width: 44px; height: 44px; background: var(--panel-2); border: 2px solid #000; border-radius: 4px; display: grid; place-items: end center; overflow: hidden; flex: none; }

/* bottom nav */
.bottomnav { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr; gap: 6px; padding: 8px 10px 10px; background: var(--bg-2); border-top: 2px solid #000; }
.bottomnav a { min-height: 48px; display: grid; place-items: center; gap: 0; background: var(--panel); border: 2px solid #000; border-radius: 6px; font: 12px var(--pixel); color: var(--muted); text-decoration: none; position: relative; padding: 4px 0; }
.bottomnav a .ico { font-size: 18px; line-height: 1; }
.bottomnav a.on { background: var(--accent); color: #fff; box-shadow: inset 0 -4px 0 var(--accent-dark); }
.badge { position: absolute; top: -6px; right: -4px; background: var(--gold); color: #000; font: 11px var(--pixel); border: 2px solid #000; border-radius: 999px; padding: 0 5px; }

/* ---------- adventure ---------- */
.strip { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.strip .name { font: 13px var(--pixel); color: var(--muted); white-space: nowrap; }
.dots { flex: 1; display: flex; gap: 3px; align-items: center; }
.dots i { flex: 1; height: 8px; background: var(--panel-2); border: 1px solid #000; }
.dots i.done { background: var(--hp); } .dots i.cur { background: var(--gold); height: 12px; }
.dots i.boss { flex: none; width: 16px; height: 16px; background: var(--accent); border-radius: 50%; }
.strip .count { font: 14px var(--pixel); color: var(--gold); }
.scene { position: relative; height: 236px; border: 2px solid #000; border-radius: 6px; overflow: hidden;
  background: linear-gradient(#5fb4e8 0 46%, #8fd0f0 46% 56%, #e9d49a 56% 100%); }
.scene::before { content: ""; position: absolute; left: 0; right: 0; top: 46%; height: 10%; background: repeating-linear-gradient(90deg, #3f8fc6 0 18px, #4c9bd2 18px 36px); opacity: .8; }
.scene::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 18%; background: repeating-linear-gradient(90deg, #d8bf7f 0 8px, #ccb06e 8px 16px); }
.scene .ovl { position: absolute; z-index: 3; }
.scene .tl { left: 8px; top: 8px; display: flex; gap: 6px; }
.scene .tr { right: 8px; top: 8px; display: flex; gap: 2px; background: rgba(10,11,18,.75); border: 2px solid #000; border-radius: 4px; padding: 2px; }
.scene .tr b { font: 12px var(--pixel); padding: 2px 6px; color: var(--muted); font-weight: normal; }
.scene .tr b.on { background: var(--accent); color: #fff; }
.chip { background: rgba(10,11,18,.75); border: 2px solid #000; border-radius: 4px; padding: 2px 6px; font: 12px var(--pixel); }
.unit { position: absolute; z-index: 2; text-align: center; }
.unit .tag { font: 11px var(--pixel); background: rgba(10,11,18,.8); border: 1px solid #000; padding: 0 4px; margin-bottom: 3px; display: inline-flex; gap: 4px; align-items: center; white-space: nowrap; }
.unit .bar { width: 64px; margin: 0 auto 3px; }
.float { position: absolute; z-index: 4; font: 18px var(--pixel); color: #fff; text-shadow: 2px 2px 0 #000, -1px -1px 0 #000; }
.float.weak { color: #c9d3e8; font-size: 13px; }
.float.crit { color: var(--gold); }
.caption { position: absolute; z-index: 3; left: 10px; right: 10px; bottom: 8px; background: #f8f6ef; color: #1b1d28; border: 2px solid #000; border-radius: 4px; padding: 4px 8px; font: 13px var(--pixel); box-shadow: 0 2px 0 #000; }
.caption em { color: #b5281f; font-style: normal; }
.bench { position: absolute; z-index: 2; bottom: 40px; display: flex; gap: 2px; align-items: flex-end; }
.team { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-top: 8px; }
.team .m { background: var(--panel); border: 2px solid #000; border-radius: 4px; padding: 4px 3px 5px; text-align: center; position: relative; }
.team .m.active { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold); }
.team .m.out { opacity: .4; }
.team .m .lv { font: 10px var(--pixel); color: var(--muted); }
.team .m .bar { margin-top: 2px; height: 5px; }
.team .m .stat { position: absolute; top: 2px; right: 2px; font: 9px var(--pixel); background: var(--dark); border: 1px solid #000; padding: 0 2px; }
.idle-row { display: flex; gap: 8px; margin-top: 10px; }
.idle-row .card { flex: 1; margin: 0; padding: 8px; }
.kv { font: 18px var(--pixel); color: var(--gold); }
.mapcard { display: flex; align-items: center; gap: 10px; }
.mapcard .chev { color: var(--muted); font: 16px var(--pixel); }
.enemy-list { display: flex; gap: 6px; flex-wrap: wrap; }
.enemy { display: flex; align-items: center; gap: 6px; background: var(--panel-2); border: 2px solid #000; border-radius: 4px; padding: 4px 8px 4px 4px; }
.hint { font-size: 12px; color: var(--muted); margin-top: 8px; padding: 6px 8px; border: 1px dashed var(--line); border-radius: 4px; }
.hint b { color: var(--text); }
.log { font-size: 12px; line-height: 1.55; color: var(--muted); max-height: 92px; overflow: hidden; }
.log b { color: var(--text); font-weight: 600; }
.log .se { color: var(--gold); }

/* ---------- sheets ---------- */
.dim { position: absolute; inset: 0; background: rgba(5,6,10,.6); z-index: 5; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; top: 56px; z-index: 6; background: var(--bg-2); border-top: 2px solid #000; border-radius: 12px 12px 0 0; display: flex; flex-direction: column; box-shadow: 0 -4px 0 #000; }
.sheet .grab { width: 44px; height: 4px; border-radius: 2px; background: var(--line); margin: 8px auto 4px; }
.sheet .head { display: flex; align-items: center; gap: 8px; padding: 4px 14px 10px; border-bottom: 1px solid var(--line); }
.sheet .head h2 { font: 20px var(--pixel); margin: 0; }
.sheet .close { margin-left: auto; }
.arc { font: 12px var(--pixel); color: var(--muted); text-transform: uppercase; margin: 14px 2px 6px; display: flex; gap: 6px; }
.arc span { margin-left: auto; }
.maprow { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 2px solid #000; border-left: 5px solid var(--line); border-radius: 6px; padding: 8px; margin-bottom: 6px; }
.maprow.cur { border-left-color: var(--gold); box-shadow: 0 0 0 1px var(--gold); }
.maprow.done { border-left-color: var(--hp); }
.maprow.locked { opacity: .5; }
.maprow .no { font: 13px var(--pixel); color: var(--dim); width: 18px; }
.maprow .t { font: 15px var(--pixel); }
.maprow .meta { font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.maprow .flags { display: flex; gap: 4px; font-size: 13px; }
.maprow .bar { width: 70px; }
.side { border-left-color: var(--dark); background: linear-gradient(90deg, rgba(138,92,214,.18), transparent 60%), var(--panel); }

.banner { position: relative; height: 150px; background: linear-gradient(#5fb4e8 0 55%, #e9d49a 55%); border-bottom: 2px solid #000; overflow: hidden; }
.banner .boss { position: absolute; right: 26px; bottom: 6px; }
.banner .state { position: absolute; left: 10px; top: 10px; }
.bossname { padding: 10px 14px 0; }
.bossname .sub { font-size: 12px; color: var(--muted); }
.bossname h2 { font: 24px var(--pixel); margin: 2px 0 6px; }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 0 14px 10px; }
.fact { background: var(--panel); border: 2px solid #000; border-radius: 4px; padding: 5px 8px; }
.fact .k { font-size: 11px; color: var(--muted); }
.fact .v { font: 16px var(--pixel); }
.skill { background: var(--panel-2); border: 2px solid #000; border-radius: 4px; padding: 6px 8px; margin-bottom: 6px; }
.skill .top { display: flex; gap: 6px; align-items: center; font: 13px var(--pixel); }
.skill .top .cd { margin-left: auto; color: var(--muted); font-size: 11px; }
.skill p { margin: 3px 0 0; font-size: 12px; color: var(--muted); }
.tiers { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
.tiers span { font: 11px var(--pixel); padding: 1px 6px; border: 1px solid #000; border-radius: 3px; background: var(--panel-2); }
.t-common { color: #cfd5e3; } .t-rare { color: #66a8ff; } .t-epic { color: #c08cff; } .t-legendary { color: var(--gold); }
.stages { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.stages b { font: 13px var(--pixel); font-weight: normal; text-align: center; padding: 6px 0; background: var(--panel-2); border: 2px solid #000; border-radius: 3px; }
.stages b.done { background: #24432c; color: #9fe0ad; } .stages b.cur { background: var(--gold); color: #000; } .stages b.lock { color: var(--dim); }
.sticky-cta { padding: 10px 14px 12px; border-top: 2px solid #000; background: var(--bg-2); display: flex; gap: 8px; }
.sticky-cta .btn { flex: 1; }

/* ---------- recruit modal ---------- */
.modal { position: absolute; z-index: 7; left: 18px; right: 18px; top: 150px; background: var(--panel); border: 2px solid #000; border-radius: 10px; box-shadow: 0 0 0 2px var(--gold), 0 6px 0 #000; overflow: hidden; }
.modal .mh { background: linear-gradient(90deg, #6b3d1d, #3a2414); padding: 10px 14px; display: flex; align-items: center; gap: 8px; border-bottom: 2px solid #000; }
.modal .mh h3 { font: 22px var(--pixel); margin: 0; }
.new { font: 11px var(--pixel); background: var(--gold); color: #000; border: 2px solid #000; border-radius: 999px; padding: 0 6px; }
.modal .mb { padding: 14px; display: flex; gap: 12px; }
.modal .art { width: 120px; height: 120px; background: radial-gradient(circle at 50% 70%, #3a4163, #1d2133 70%); border: 2px solid #000; border-radius: 8px; display: grid; place-items: end center; padding-bottom: 6px; flex: none; }

/* ---------- desktop ---------- */
.desk { width: 1280px; height: 800px; background: var(--bg); border: 1px solid #000; display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
.desk .cols { display: grid; grid-template-columns: 240px 1fr 320px; min-height: 0; }
.desk .sidebar { background: var(--bg-2); border-right: 2px solid #000; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
.navitem { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 2px solid transparent; border-radius: 6px; font: 15px var(--pixel); color: var(--muted); }
.navitem.on { background: var(--accent); color: #fff; border-color: #000; box-shadow: inset 0 -4px 0 var(--accent-dark); }
.navitem .badge { position: static; margin-left: auto; }
.desk .center { padding: 14px 18px; overflow: auto; }
.desk .center .scene { height: 400px; }
.desk .right { border-left: 2px solid #000; background: var(--bg-2); padding: 12px; overflow: auto; }
.desk .ticker { border: 0; padding: 0; }
</style>
</head>
